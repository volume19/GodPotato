[package]
name = "godpotato"
version = "0.1.0"
edition = "2021"
authors = ["GodPotato Contributors"]
license = "Apache-2.0"
description = "Windows privilege escalation research tool - Rust port"
repository = "https://github.com/volume19/GodPotato"

[[bin]]
name = "godpotato"
path = "src/main.rs"

[dependencies]
# Binary parsing
binrw = "0.13"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Windows APIs (windows-only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
hex-literal = "0.4"
